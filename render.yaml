services:
  - type: web
    name: hallulies-website
    env: python
    buildCommand: pip install -r requirements-api.txt
    startCommand: python api-server.py
    autoDeploy: true
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_VERSION
        value: 18
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block